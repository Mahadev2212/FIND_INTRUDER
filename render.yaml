# Render Blueprint: one web service (Docker) + one managed PostgreSQL.
# Render dashboard → New → Blueprint → pick this repo/branch. DATABASE_URL is wired automatically.
services:
  - type: web
    name: chaintrace
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chaintrace-db
          property: connectionString

databases:
  - name: chaintrace-db
    plan: free
    databaseName: chaintrace
    postgresMajorVersion: "16"
